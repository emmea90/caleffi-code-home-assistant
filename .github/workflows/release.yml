name: Release

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag da pubblicare, per esempio v0.1.1"
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    name: Publish GitHub release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout the repository
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}

      - name: Check the version
        id: version
        env:
          EVENT_NAME: ${{ github.event_name }}
          REQUESTED_TAG: ${{ inputs.tag }}
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            ref="$REQUESTED_TAG"
          else
            ref="$GITHUB_REF_NAME"
          fi
          if [[ ! "$ref" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Il tag '$ref' non è nel formato vX.Y.Z"
            exit 1
          fi
          manifest="$(jq -r .version custom_components/caleffi_code/manifest.json)"
          if [ "${ref#v}" != "$manifest" ]; then
            echo "::error::Il tag $ref non coincide con manifest.json ($manifest)"
            exit 1
          fi
          echo "tag=$ref" >> "$GITHUB_OUTPUT"

      - name: Package the integration
        run: |
          cd custom_components/caleffi_code
          zip -r "$GITHUB_WORKSPACE/caleffi_code.zip" . -x "*__pycache__*" "*.pyc"

      - name: Publish the GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          files: caleffi_code.zip
          generate_release_notes: true
          fail_on_unmatched_files: true
